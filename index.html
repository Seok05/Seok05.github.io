<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seok Lab — 연구하면서, 사업합니다</title>
    <meta
      name="description"
      content="연구하듯 사업하는 Seok의 블로그. 서비스를 만들며 부딪힌 문제와 배터리 연구 기록."
    />
    <meta property="og:title" content="Seok Lab — 연구하면서, 사업합니다" />
    <meta
      property="og:description"
      content="서비스를 만들며 부딪힌 문제와 배터리 연구 기록."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://seok05.github.io/assets/profile.png" />
    <link rel="stylesheet" href="assets/blog.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="site-name" href="./">
          <img class="avatar-sm" src="assets/profile.png" alt="" width="30" height="30" />
          Seok Lab
          <span class="tagline">연구하면서, 사업합니다</span>
        </a>
        <nav class="site-nav">
          <a href="https://github.com/Seok05">GitHub</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="layout">
        <section class="content">
          <div class="list-head">
            <h1 id="list-title">전체 글</h1>
            <span class="n" id="list-count"></span>
          </div>
          <p class="list-desc" id="list-desc" hidden></p>

          <!-- 글 목록은 assets/posts.js 데이터로 site.js가 채운다.
               새 글은 posts/에 HTML을 넣고 posts.js에 항목만 추가하면 된다. -->
          <ul class="post-list" id="posts">
            <noscript>
              <li>
                <p>
                  이 목록은 자바스크립트로 그려집니다. 글은
                  <a href="https://github.com/Seok05/Seok05.github.io/tree/main/posts">posts/ 폴더</a>에서
                  직접 볼 수 있습니다.
                </p>
              </li>
            </noscript>
          </ul>
        </section>

        <aside class="sidebar">
          <div class="profile-card">
            <img src="assets/profile.png" alt="Seok 프로필" width="92" height="92" />
            <div>
              <p class="p-name">Seok</p>
              <p class="p-bio">
                연구하듯 사업합니다.<br />
                낮에는 서비스를 만들고, 밤에는 데이터를 들여다봅니다. 그 과정에서 배운 걸 여기에
                적어요.
              </p>
              <a class="p-link" href="https://github.com/Seok05">GitHub</a>
            </div>
          </div>

          <nav class="cat-box" aria-label="카테고리">
            <p class="cat-title">카테고리</p>
            <ul>
              <li><a href="./" data-cat="all">전체보기</a></li>
            </ul>
          </nav>
        </aside>
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>Seok Lab · 연구하면서, 사업합니다</p>
        <p>글의 예시 수치는 설명용이며 실제 시세가 아닙니다. · <a href="https://github.com/Seok05">GitHub</a></p>
      </div>
    </footer>

    <script src="assets/posts.js"></script>
    <script src="assets/site.js"></script>
  </body>
</html>
