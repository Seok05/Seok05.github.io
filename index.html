<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seok Lab — 연구하면서, 사업합니다</title>
    <meta
      name="description"
      content="연구하듯 사업하는 Seok의 블로그. 서비스를 만들며 부딪힌 문제와 배터리 연구 기록."
    />
    <meta property="og:title" content="Seok Lab — 연구하면서, 사업합니다" />
    <meta
      property="og:description"
      content="서비스를 만들며 부딪힌 문제와 배터리 연구 기록."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://seok05.github.io/assets/profile.png" />
    <link rel="stylesheet" href="assets/blog.css" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
  </head>
  <body class="home">
    <header class="site-header">
      <div class="wrap">
        <a class="site-name" href="./">
          <img class="avatar-sm" src="assets/profile.png" alt="" width="30" height="30" />
          Seok Lab
        </a>
        <nav class="site-nav">
          <a href="./?view=all" data-nav="all">글</a>
          <a href="./#series" data-nav="series">시리즈</a>
          <a href="https://github.com/Seok05">GitHub</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- 홈: 소개 → 지금 쓰는 시리즈 → 시리즈 전체 → 최근 글.
           목록은 assets/posts.js 데이터로 site.js가 채운다. -->
      <section class="hero wrap" id="hero">
        <div class="hero-text">
          <p class="eyebrow">Seok Lab</p>
          <h1>연구하면서, <br />사업합니다.</h1>
          <p class="hero-sub">
            낮에는 서비스를 만들고, 밤에는 데이터를 들여다봅니다. 그 과정에서 배운 것을 그날의
            기록으로 남깁니다.
          </p>
          <div class="hero-actions" id="hero-actions">
            <a class="btn" href="https://github.com/Seok05">GitHub</a>
          </div>
        </div>
        <img class="hero-avatar" src="assets/profile.png" alt="Seok" width="160" height="160" />
      </section>

      <section class="wrap sec" id="featured" aria-label="지금 쓰는 시리즈"></section>
      <section class="wrap sec" id="series" aria-label="시리즈"></section>
      <section class="wrap sec" id="recent" aria-label="최근 글"></section>

      <!-- ?view=all (전체 글, 월별) · ?cat=<key> (카테고리) 일 때만 보인다 -->
      <section class="wrap sec listing" id="listing" hidden>
        <noscript>
          <p>
            이 목록은 자바스크립트로 그려집니다. 글은
            <a href="https://github.com/Seok05/Seok05.github.io/tree/main/posts">posts/ 폴더</a>에서
            직접 볼 수 있습니다.
          </p>
        </noscript>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <div class="foot-brand">
          <p class="foot-name">Seok Lab</p>
          <p>연구하면서, 사업합니다</p>
        </div>
        <nav class="foot-nav" aria-label="바닥 메뉴">
          <a href="./?view=all">글</a>
          <a href="./#series">시리즈</a>
          <a href="https://github.com/Seok05">GitHub</a>
        </nav>
        <p class="foot-note">글의 예시 수치는 설명용이며 실제 시세가 아닙니다.</p>
      </div>
    </footer>

    <script src="assets/posts.js"></script>
    <script src="assets/site.js"></script>
  </body>
</html>
